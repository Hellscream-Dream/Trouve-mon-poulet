    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>KFC Finder France - Un Goût Unique</title>
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        
        <style>
            :root {
                --kfc-red: #A3080C;
                --kfc-dark-red: #7A0609;
                --white: #FFFFFF;
                --dark: #1A1A1A;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Arial Black', Impact, sans-serif;
            }

            body, html {
                height: 100%;
                overflow: hidden;
                background-color: #f7f4ef;
            }

            /* Arrière-plan animé avec le poulet qui tombe */
            #chickenCanvas {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
                pointer-events: none;
            }

            /* Conteneur principal de l'application */
            .app-container {
                display: flex;
                flex-direction: column;
                height: 100dvh;
                max-width: 480px;
                margin: 0 auto;
                background: rgba(255, 255, 255, 0.92);
                box-shadow: 0 0 30px rgba(0,0,0,0.15);
                border-left: 4px solid var(--kfc-red);
                border-right: 4px solid var(--kfc-red);
                position: relative;
                z-index: 1;
            }

            /* En-tête de l'application avec le style du logo KFC */
            header {
                background: var(--kfc-red);
                color: var(--white);
                text-align: center;
                padding: 15px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.2);
                border-bottom: 5px solid #000;
            }

            .logo-placeholder {
                display: inline-block;
                background: var(--white);
                color: var(--kfc-red);
                padding: 5px 15px;
                font-size: 24px;
                letter-spacing: 2px;
                border-radius: 4px;
                border: 2px solid #000;
                text-shadow: 1px 1px 0px #000;
                box-shadow: 3px 3px 0px #000;
            }

            .sub-logo {
                font-size: 11px;
                text-transform: uppercase;
                margin-top: 5px;
                letter-spacing: 3px;
                color: #ffb3b4;
            }

            /* Panneau de configuration des entrées utilisateur */
            .panel {
                padding: 20px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                position: relative;
            }

            .input-group {
                display: flex;
                flex-direction: column;
                gap: 5px;
                position: relative;
            }

            label {
                color: var(--dark);
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            input[type="text"] {
                padding: 12px 15px;
                border: 3px solid #000;
                border-radius: 8px;
                font-size: 14px;
                font-family: sans-serif;
                font-weight: bold;
                outline: none;
                box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
            }

            input[type="text"]:focus {
                border-color: var(--kfc-red);
            }

            /* Liste déroulante simplifiée style Google Maps */
            .autocomplete-suggestions {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: white;
                border: 3px solid #000;
                border-top: none;
                border-radius: 0 0 8px 8px;
                max-height: 220px;
                overflow-y: auto;
                z-index: 999;
                box-shadow: 0 8px 16px rgba(0,0,0,0.15);
                font-family: sans-serif;
                display: none;
            }

            .suggestion-item {
                padding: 12px 15px;
                cursor: pointer;
                font-size: 13.5px;
                border-bottom: 1px solid #eee;
                text-align: left;
                font-family: sans-serif;
                font-weight: normal;
                color: #222;
            }

            .suggestion-item:last-child {
                border-bottom: none;
            }

            .suggestion-item:hover {
                background-color: #f9f9f9;
                color: var(--kfc-red);
                font-weight: bold;
            }

            button {
                background: var(--kfc-red);
                color: var(--white);
                border: 3px solid #000;
                padding: 14px;
                font-size: 16px;
                border-radius: 8px;
                cursor: pointer;
                box-shadow: 4px 4px 0px #000;
                transition: all 0.1s ease;
                text-transform: uppercase;
            }

            button:active {
                transform: translate(2px, 2px);
                box-shadow: 2px 2px 0px #000;
            }

            /* Fenêtre d'affichage du résultat final */
            .result-box {
                background: #fff;
                border: 3px solid #000;
                border-radius: 8px;
                padding: 15px;
                display: none;
                animation: slideIn 0.3s ease-out forwards;
                box-shadow: 4px 4px 0px rgba(0,0,0,0.05);
            }

            @keyframes slideIn {
                from { transform: translateY(10px); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }

            .result-title {
                color: var(--kfc-red);
                font-size: 16px;
                margin-bottom: 5px;
            }

            .result-address {
                font-family: sans-serif;
                font-size: 14px;
                color: #555;
                margin-bottom: 8px;
            }

            .result-meta {
                font-size: 12px;
                background: #f0f0f0;
                padding: 4px 8px;
                display: inline-block;
                border-radius: 4px;
                border: 1px solid #ccc;
            }

            /* Conteneur de carte */
            .map-wrapper {
                flex: 1;
                position: relative;
                border-top: 3px solid #000;
            }

            #map {
                width: 100%;
                height: 100%;
            }

            .loader {
                display: none;
                text-align: center;
                font-size: 14px;
                color: var(--kfc-red);
                padding: 10px;
            }
        </style>
    </head>
    <body>

        <canvas id="chickenCanvas"></canvas>

        <div class="app-container">
            <header>
                <div class="logo-placeholder">KFC</div>
                <div class="sub-logo">Le Plus Proche (France)</div>
            </header>

            <div class="panel">
                <div class="input-group">
                    <label for="addressInput">Entrez votre adresse en France :</label>
                    <input type="text" id="addressInput" placeholder="Ex: 285 Rue Garibaldi, Lyon..." value="285 Rue Garibaldi, Lyon" autocomplete="off">
                    <div id="autocompleteResults" class="autocomplete-suggestions"></div>
                </div>
                <button onclick="findNearestKFC()">Trouver mon Poulet 🍗</button>
                
                <div class="loader" id="loader">Calcul de l'itinéraire croustillant...</div>

                <div class="result-box" id="resultBox">
                    <div class="result-title" id="kfcName">📍 KFC Trouvé</div>
                    <div class="result-address" id="kfcAddress">Adresse du restaurant...</div>
                    <div class="result-meta" id="kfcDistance">Distance : -- km</div>
                </div>
            </div>

            <div class="map-wrapper">
                <div id="map"></div>
            </div>
        </div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <script>
            // --- 1. SIMULATION PHYSIQUE DU POULET FRIT ANIME ---
            const canvas = document.getElementById('chickenCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const chickenEmoji = ['🍗', '🍟'];
            const particles = [];
            const maxParticles = 30;

            class ChickenParticle {
                constructor() { this.reset(); this.y = Math.random() * canvas.height; }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = -50;
                    this.size = Math.random() * 20 + 20;
                    this.speedY = Math.random() * 2 + 1.2;
                    this.spin = Math.random() * 0.02 - 0.01;
                    this.angle = Math.random() * Math.PI * 2;
                    this.type = chickenEmoji[Math.floor(Math.random() * chickenEmoji.length)];
                }
                update() {
                    this.y += this.speedY; this.angle += this.spin;
                    if (this.y > canvas.height + 50) this.reset();
                }
                draw() {
                    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                    ctx.font = `${this.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(this.type, 0, 0); ctx.restore();
                }
            }

            for (let i = 0; i < maxParticles; i++) particles.push(new ChickenParticle());
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();

            // --- 2. CONFIGURATION DE LA CARTE LEAFLET ---
            const map = L.map('map').setView([45.753612, 4.851240], 13); // Centré par défaut près de Lyon
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            let userMarker, kfcMarker, routeLine;
            const kfcIcon = L.divIcon({
                html: '<div style="background-color: #A3080C; width: 30px; height: 30px; border-radius: 50%; border: 3px solid black; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.4);">🍗</div>',
                className: '', iconSize: [30, 30], iconAnchor: [15, 15]
            });

            // --- 3. BASE DE DONNÉES DE VRAIS RESTAURANTS KFC EN FRANCE ---
            const REAL_FRANCE_KFCS = [
                // Branches Lyonnaises
                { name: "KFC Lyon Garibaldi", lat: 45.753612, lng: 4.851240, addr: "285 Rue Garibaldi, 69007 Lyon" },
                { name: "KFC Lyon Villeurbanne", lat: 45.761230, lng: 4.891120, addr: "257 Rue Léon Blum, 69100 Villeurbanne" },
                { name: "KFC Lyon Pierre Bénite", lat: 45.698711, lng: 4.814522, addr: "17 Chemin des Mûriers, 69540 Irigny" },
                // Branches Parisiennes
                { name: "KFC Paris Sébastopol", lat: 48.862417, lng: 2.348324, addr: "31 Bd de Sébastopol, 75001 Paris" },
                { name: "KFC Paris Place de la République", lat: 48.867252, lng: 2.363711, addr: "21 Place de la République, 75003 Paris" },
                { name: "KFC Paris Montmartre", lat: 48.871234, lng: 2.341855, addr: "20 Boulevard Montmartre, 75009 Paris" },
                { name: "KFC Paris Place Clichy", lat: 48.883111, lng: 2.327522, addr: "10 Bis Place de Clichy, 75009 Paris" },
                { name: "KFC Paris Gare de l'Est", lat: 48.876312, lng: 2.359214, addr: "6 Rue du 8 Mai 1945, 75010 Paris" },
                { name: "KFC Paris Place d'Italie", lat: 48.831201, lng: 2.356114, addr: "211 Boulevard Vincent Auriol, 75013 Paris" }
            ];

            // --- 4. LOGIQUE D'AUTOCOMPLÉTION SIMPLIFIÉE (STYLE GOOGLE MAPS) ---
            const addressInput = document.getElementById('addressInput');
            const suggestionsContainer = document.getElementById('autocompleteResults');
            let debounceTimer;

            // Fonction pour nettoyer l'adresse et ne garder que "Rue, Code Postal Ville"
            function formatCleanAddress(addressObj) {
                if (!addressObj) return "";
                
                // On extrait les composants essentiels de l'API OpenStreetMap
                const road = addressObj.road || addressObj.pedestrian || addressObj.suburb || "";
                const houseNumber = addressObj.house_number ? addressObj.house_number + " " : "";
                const city = addressObj.city || addressObj.town || addressObj.village || "";
                const postcode = addressObj.postcode || "";

                // Si on a au moins une rue et une ville, on fait un format court précis
                if (road && city) {
                    return `${houseNumber}${road}, ${postcode} ${city}`.trim();
                }
                
                // Structure de repli si l'adresse n'est pas complète
                return null;
            }

            addressInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                const query = addressInput.value.trim();

                if (query.length < 3) {
                    suggestionsContainer.style.display = 'none';
                    return;
                }

                debounceTimer = setTimeout(async () => {
                    try {
                        // L'option 'addressdetails=1' demande à l'API de séparer les composants (code postal, ville, rue)
                        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=fr&accept-language=fr&q=${encodeURIComponent(query)}&limit=5`);
                        const data = await response.json();
                        renderSuggestions(data);
                    } catch (error) {
                        console.error("Erreur d'autocomplétion:", error);
                    }
                }, 300);
            });

            function renderSuggestions(list) {
                suggestionsContainer.innerHTML = '';
                if (list.length === 0) { suggestionsContainer.style.display = 'none'; return; }

                list.forEach(item => {
                    // Essayer de générer le format court propre "Google Maps"
                    let cleanText = formatCleanAddress(item.address);
                    
                    // Si l'adresse est trop vague, on utilise le format standard par défaut mais écourté (sans pays)
                    if (!cleanText) {
                        cleanText = item.display_name.split(',').slice(0, 3).join(',');
                    }

                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerText = cleanText;
                    
                    div.addEventListener('click', () => {
                        addressInput.value = cleanText; // Injecte l'adresse courte et propre dans la barre
                        suggestionsContainer.style.display = 'none';
                        findNearestKFC(); 
                    });
                    suggestionsContainer.appendChild(div);
                });
                suggestionsContainer.style.display = 'block';
            }

            document.addEventListener('click', (e) => {
                if (e.target !== addressInput && e.target !== suggestionsContainer) {
                    suggestionsContainer.style.display = 'none';
                }
            });

            // --- 5. CALCUL DU PARCOURS ROUTIER ---
            async function findNearestKFC() {
                const addressStr = addressInput.value;
                if (!addressStr.trim()) return alert('Veuillez entrer une adresse.');

                const loader = document.getElementById('loader');
                const resultBox = document.getElementById('resultBox');
                
                loader.style.display = 'block';
                resultBox.style.display = 'none';

                try {
                    // Récupération des coordonnées géographiques
                    const geocodeUrl = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=fr&accept-language=fr&q=${encodeURIComponent(addressStr)}&limit=1`;
                    const geoRes = await fetch(geocodeUrl);
                    const geoData = await geoRes.json();

                    if (!geoData || geoData.length === 0) throw new Error("Adresse introuvable en France.");

                    const userLat = parseFloat(geoData[0].lat);
                    const userLng = parseFloat(geoData[0].lon);

                    // Identification du restaurant le plus proche
                    let closestKFC = null;
                    let minDistance = Infinity;

                    REAL_FRANCE_KFCS.forEach(kfc => {
                        const d = Math.sqrt(Math.pow(kfc.lat - userLat, 2) + Math.pow(kfc.lng - userLng, 2));
                        if (d < minDistance) {
                            minDistance = d;
                            closestKFC = kfc;
                        }
                    });

                    // Génération de l'itinéraire routier via OSRM
                    const routingUrl = `https://router.project-osrm.org/route/v1/driving/${userLng},${userLat};${closestKFC.lng},${closestKFC.lat}?overview=full&geometries=geojson`;
                    const routeRes = await fetch(routingUrl);
                    const routeData = await routeRes.json();

                    if (!routeData.routes || routeData.routes.length === 0) throw new Error("Impossible de calculer l'itinéraire routier.");

                    const geometry = routeData.routes[0].geometry;
                    const distanceKm = (routeData.routes[0].distance / 1000).toFixed(2);
                    const durationMins = Math.ceil(routeData.routes[0].duration / 60);

                    // Réinitialisation de la carte
                    if (userMarker) map.removeLayer(userMarker);
                    if (kfcMarker) map.removeLayer(kfcMarker);
                    if (routeLine) map.removeLayer(routeLine);

                    userMarker = L.marker([userLat, userLng]).addTo(map).bindPopup("Vous êtes ici").openPopup();
                    kfcMarker = L.marker([closestKFC.lat, closestKFC.lng], {icon: kfcIcon}).addTo(map).bindPopup(closestKFC.name);

                    const coordinates = geometry.coordinates.map(coord => [coord[1], coord[0]]);
                    routeLine = L.polyline(coordinates, {
                        color: '#A3080C', weight: 6, opacity: 0.85, dashArray: '5, 10', lineJoin: 'round'
                    }).addTo(map);

                    const bounds = L.latLngBounds([userLat, userLng], [closestKFC.lat, closestKFC.lng]);
                    map.fitBounds(bounds, { padding: [50, 50] });

                    // Affichage final des résultats
                    document.getElementById('kfcName').innerText = `📍 Proche de vous : ${closestKFC.name}`;
                    document.getElementById('kfcAddress').innerText = closestKFC.addr;
                    document.getElementById('kfcDistance').innerText = `Distance : ${distanceKm} km (${durationMins} min en voiture)`;
                    resultBox.style.display = 'block';

                } catch (err) {
                    alert(`Erreur : ${err.message}`);
                } finally {
                    loader.style.display = 'none';
                }
            }

            // Lancement initial au chargement
            window.onload = () => { findNearestKFC(); };
        </script>
    </body>
    </html>
